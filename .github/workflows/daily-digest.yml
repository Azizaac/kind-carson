name: Daily Tech Radar & Commit Sync

on:
  schedule:
    # Jalan tiap hari jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

permissions:
  contents: write

jobs:
  sync-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Digest Sync
        run: |
          python main.py

      - name: Push Changes (if any)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs(digest): automated daily tech radar update [$(date +'%Y-%m-%d')]"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi
